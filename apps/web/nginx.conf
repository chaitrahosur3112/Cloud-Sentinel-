server {
    listen 3000;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Gzip compression — reduces response sizes by ~70% for JS/CSS
    gzip              on;
    gzip_vary         on;
    gzip_types        text/plain text/css application/json
                      application/javascript text/xml application/xml
                      application/xml+rss text/javascript;
    gzip_min_length   1000;

    # Cache static assets for 1 year — Vite fingerprints filenames on build
    # so this is safe: a new build generates new filenames, busting the cache.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2)$ {
        expires     1y;
        add_header  Cache-Control "public, immutable";
    }

    # Never cache index.html — it's the entry point and must always be fresh
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # React Router — all unknown paths serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }


    # Security headers
    add_header X-Frame-Options        "SAMEORIGIN"     always;
    add_header X-Content-Type-Options "nosniff"        always;
    add_header X-XSS-Protection       "1; mode=block"  always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
}