# Build — runs after CI passes on main.
# Builds all three Docker images and pushes to Docker Hub.

name: Build & Push

on:
  workflow_run:
    workflows: [CI]
    types:     [completed]
    branches:  [main]

jobs:
  build:
    name: Build Docker images
    # Only run if CI passed — don't push broken images
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        # Buildx enables BuildKit — parallel layer caching and
        # multi-platform builds. Significantly faster than plain docker build.

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── Build the short commit SHA as an image tag ──
      # This means every image is traceable back to an exact commit.
      # "latest" is also tagged so docker-compose.prod.yml can always pull
      # the most recent version without knowing the SHA.
      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          push:    true
          target:  runner
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cloudcost-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/cloudcost-api:${{ github.sha }}
          # Cache layers from the previous build — hugely speeds up rebuilds
          # when only a few source files changed.
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Build and push ML service image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/ml-service
          push:    true
          target:  runner
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cloudcost-ml:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/cloudcost-ml:${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/web
          push:    true
          target:  runner
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cloudcost-web:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/cloudcost-web:${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Create deployment summary
        run: |
          echo "## Docker Images Built 🐳" >> $GITHUB_STEP_SUMMARY
          echo "| Image | Tag |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| cloudcost-api | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| cloudcost-ml  | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| cloudcost-web | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY