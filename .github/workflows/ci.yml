# CI — runs on every push and pull request to main.
# Fails fast: if any job fails, downstream jobs don't run.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs when a new commit is pushed to the same branch.
# Saves runner minutes — no point finishing a test run for a commit
# that's already been superseded.
concurrency:
  group:  ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # Job 1: API — TypeScript type-check + tests
  # ─────────────────────────────────────────────
  api-ci:
    name: API — Type-check & Tests
    runs-on: ubuntu-latest

    # Spin up Postgres and Redis as service containers.
    # They start before the job steps and are reachable at localhost.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER:     testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB:       cloudcost_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://testuser:testpass@localhost:5432/cloudcost_test?schema=public

      - name: Run database migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://testuser:testpass@localhost:5432/cloudcost_test?schema=public

      - name: TypeScript type-check
        run: npx tsc --noEmit -p tsconfig.json

      - name: Run tests
        run: npm test
        env:
          NODE_ENV:               test
          DATABASE_URL:           postgresql://testuser:testpass@localhost:5432/cloudcost_test?schema=public
          REDIS_URL:              redis://localhost:6379
          ACCESS_TOKEN_SECRET:    test-access-secret-32-chars-min
          REFRESH_TOKEN_SECRET:   test-refresh-secret-32-chars-min
          ACCESS_TOKEN_EXPIRES_IN: 15m
          REFRESH_TOKEN_EXPIRES_IN: 7d
          ML_SERVICE_URL:         http://localhost:8000

  # ─────────────────────────────────────────────
  # Job 2: ML Service — Python lint + tests
  # ─────────────────────────────────────────────
  ml-ci:
    name: ML Service — Lint & Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/ml-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/ml-service/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          pip install flake8
          # Stop if there are syntax errors or undefined names
          flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Warn on style issues but don't fail
          flake8 app/ --count --exit-zero --max-complexity=10 --max-line-length=100 --statistics

      - name: Run tests
  run: |
    pip install pytest pytest-asyncio httpx
    PYTHONPATH=. pytest tests/ -v

  # ─────────────────────────────────────────────
  # Job 3: Web — TypeScript type-check
  # ─────────────────────────────────────────────
  web-ci:
    name: Web — Type-check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: Build (verify Vite builds cleanly)
        run: npm run build