# PR Check — fast feedback on every pull request.
# Type-check + tests only — no Docker build, no deploy.
# Should finish in under 3 minutes so developers get quick feedback.

name: PR Check

on:
  pull_request:
    branches: [main]
    types:    [opened, synchronize, reopened]

jobs:
  api-check:
    name: API type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.json

  web-check:
    name: Web type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

  # Add a PR comment summarizing what changed
  pr-summary:
    name: PR Summary
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Count changed files
        id: changes
        run: |
          API_CHANGES=$(git diff --name-only origin/main...HEAD -- apps/api/ | wc -l)
          WEB_CHANGES=$(git diff --name-only origin/main...HEAD -- apps/web/ | wc -l)
          ML_CHANGES=$(git diff --name-only origin/main...HEAD -- apps/ml-service/ | wc -l)
          echo "api=$API_CHANGES"   >> $GITHUB_OUTPUT
          echo "web=$WEB_CHANGES"   >> $GITHUB_OUTPUT
          echo "ml=$ML_CHANGES"     >> $GITHUB_OUTPUT

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              body: `## PR Check Summary
            | App | Files Changed |
            |-----|--------------|
            | API | ${{ steps.changes.outputs.api }} |
            | Web | ${{ steps.changes.outputs.web }} |
            | ML  | ${{ steps.changes.outputs.ml  }} |

            TypeScript checks run on every push to this PR.
            Full CI + Docker build runs when merged to main.`
            })