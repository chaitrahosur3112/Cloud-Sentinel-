# Production Redis configuration

# Don't save to disk for pure caching workload.
# If you want persistence, change to: save 900 1
save ""

# Max memory — evict least-recently-used keys when full
maxmemory     512mb
maxmemory-policy allkeys-lru

# Security
protected-mode yes

# Performance
tcp-backlog 511
timeout     300
tcp-keepalive 300