# Production PostgreSQL tuning.
# These values are for a 2GB RAM server — adjust based on your instance size.

# Connections
max_connections = 100

# Memory
shared_buffers        = 512MB    # 25% of total RAM
effective_cache_size  = 1536MB   # 75% of total RAM
work_mem              = 5MB      # per sort operation
maintenance_work_mem  = 128MB    # for VACUUM, CREATE INDEX

# Write-ahead log (durability vs performance)
wal_buffers           = 16MB
checkpoint_completion_target = 0.9

# Query planner
random_page_cost      = 1.1      # SSD = 1.1, spinning disk = 4.0
effective_io_concurrency = 200   # SSD: 200, spinning disk: 2

# Logging — helpful for finding slow queries
log_min_duration_statement = 1000    # log queries slower than 1 second
log_checkpoints            = on
log_connections            = on
log_disconnections         = on